name: Build & Deploy to Hostinger

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 65002 145.79.30.66 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy and Build on Hostinger
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key -p 65002 u293105347@145.79.30.66 << 'EOF'
            cd ~/domains/admin.bitsolmarketing.com/public_html
            
            # Pull latest changes (ignoring local modifications if any)
            git reset --hard
            git pull origin master
            
            # Install and Build
            npm ci
            npm run build
            
            # Restart Passenger
            mkdir -p tmp
            touch tmp/restart.txt
            echo "Deployment completed at $(date)"
          EOF
